name: Post-Deploy IndexNow

on:
  workflow_dispatch:

jobs:
  post-deploy-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run Post-Deploy SEO Pipeline (IndexNow)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: npx tsx scripts/post-deploy-seo.ts
