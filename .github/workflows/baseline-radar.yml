name: Living Baseline Radar

on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview Baseline drift without modifying concept or evidence files'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  baseline-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install latest web-features
        run: npm install --no-save web-features@latest

      - name: Run Living Baseline Radar
        run: |
          FLAGS="--report-out baseline-radar-report.md"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          else
            FLAGS="$FLAGS --write-digest"
          fi
          npx tsx scripts/sync-baseline-radar.ts $FLAGS

      - name: Check for git diff
        id: git_diff
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard content/)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full verification suite
        if: ${{ github.event.inputs.dry_run != 'true' && steps.git_diff.outputs.has_changes == 'true' }}
        run: npm run check:all

      - name: Create Baseline Sync PR
        if: ${{ github.event.inputs.dry_run != 'true' && steps.git_diff.outputs.has_changes == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.NIGHTLY_PR_TOKEN }}
          commit-message: 'chore(radar): weekly baseline sync'
          branch: 'radar/baseline-sync-${{ github.run_id }}'
          delete-branch: true
          title: 'chore(radar): weekly baseline sync'
          body-path: baseline-radar-report.md
          labels: |
            baseline-radar
            automated-pr
