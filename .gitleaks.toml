title = "frontend.rocks"

[extend]
useDefault = true

[[allowlists]]
description = "Cloudflare Web Analytics beacon token: public by design, it ships in the HTML of every page."
condition = "AND"
paths = ['''src/app/\(site\)/layout\.tsx$''']
regexTarget = "line"
regexes = ['''data-cf-beacon''']

[[allowlists]]
description = "Experiment expectKey identifiers (kebab-case) in challenge configs and challenge tests."
condition = "AND"
paths = [
  '''^content/experiments/[^/]+/challenge\.json$''',
  '''^tests/challenge\.test\.ts$''',
]
regexTarget = "line"
regexes = ['''"?expectKey"?\s*:\s*['"][a-z0-9-]+['"]''']
