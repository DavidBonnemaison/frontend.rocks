[build]
  publish = "dist"
  command = "npm run build-prod"

[build.environment]
  NODE_VERSION = "24"

[[edge_functions]]
  path = "/concepts/*"
  function = "markdown-negotiation"

[[edge_functions]]
  path = "/autopsies/*"
  function = "markdown-negotiation"

[[edge_functions]]
  path = "/vs/*"
  function = "markdown-negotiation"

[[headers]]
  for = "/concepts/*"
  [headers.values]
    Vary = "Accept"

[[headers]]
  for = "/autopsies/*"
  [headers.values]
    Vary = "Accept"

[[headers]]
  for = "/vs/*"
  [headers.values]
    Vary = "Accept"

[[headers]]
  for = "/data/results.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/claims.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
